[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "foundation"
version = "26.1.0"
edition = "2021"
authors = ["arlomu"]
description = "Foundation framework for TontooOS – Apple Foundation reimplemented in Rust for TontooOS"
license = "TCL"
repository = "https://github.com/TontooOS/foundation"
keywords = ["tontoo", "foundation", "utilities", "date", "url", "formatting"]
categories = ["data-structures", "encoding"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
url = "2"
plist = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# mDNS / Bonjour
mdns-sd = { version = "0.11", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "4", optional = true }

[features]
default = []
bonjour = ["mdns-sd"]
dbus = ["zbus"]
